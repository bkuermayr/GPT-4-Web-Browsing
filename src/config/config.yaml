template_category: |
  You will be provided with a JSON structure inside of triple quotes that represents a hierarchical order of a category structure, each key is a category that included its name and uniqued id, in the format "name(id)".
  **Category Structure:**
  """{categories}"""

  You will also be provided with a list of key-value pairs representing product attributes. Each key represents an attribute name, and the value represents the corresponding attribute value. These attributes are inside quadruple quotes as shown below:
  """"{attributes}""""

  **Instructions:**
  You are a helpful data specialist. Your task is to determine in which category the following product should be assigned based on the given category structure, product attributes, product name and an image of the product (if present).
    - Assign the deepest category possible:
      * Look for the most specific category or subcategory that fits the product. If the product fits a subcategory or subsubcategory, assign the product to that level.
    - If unsure, assign a more general category:
        * If you are uncertain about which category is most appropriate, you are allowed to assign the product to a more general category.
    - If still unsure, do not assign any category:
        * If you cannot find a suitable category for the product, do not assign any category. In this case, return answer_id as -1, name and answer_path as an empty string "".

  **Image Analysis**:
  - If a image is attached to this prompt, analyze the image and use it to enhance your response.  
  - If no image is available, ignore this step.   

  **Output Format:
  Your final response must be a JSON object structured as follows:
  
    "name": //Name of the category you assigned to it, dont include the id in the name, use only the most subcategory, dont include the previos path
    "answer_id": //ID of the category you assigned to it
    "answer_path": //The path to the subcategory, ex: "category 1 > sub 1 > subsub 2", only use names of the categories and dont include the id
  
  If you have not assigned a category, set the answer_id to -1 and the name and answer_path to a empty string.

  Product: {product_name}
  Output Format: json-object

template_attribute_parent: |
  You will be provided with some attributes of the product, which are delimited by triple quotes. Each attribute is defined via a key-pair value, where the key is the type of attribute (price, color, etc.).
  These attributes provide valuable details about the product, and your task is to use them to to fulfill your instructions, which are listed later on.
  **Input Attributes:**
  """{input_attributes}"""

  Furthermore, you will be provided with some output attributes. You have to fill these out. Each of these attributes has a type and can therefore even have a value domain.
  As an example in Integers are only Integer Values allowed or in select fields only a specific answer is allowed. Therefore each of these output attributes has a domain.
  The domain can be missing from the specification, then you have to refer it from the type (Integer => only Integer values) or if a domain is provided, you have to follow it. Some types like metric only specific the metric of the value and you have to follow that.
  The output attributes will be listed for you as a array of json structures in the quadruple quotes. Each entry has the keys name, type and a optional key called domain which will be an array.
  **Output Attributes:**
  """"{output_attributes}""""

  **Instructions:**
  You are a helpful data specialist. Your task is to use the Input Attributes and the product name to fill out the Output Attributes.
  For that you have to follow the following instructions:
    - You have to follow the domain values of each output attribute.
    - If you cannot assign a value(s) to the output, you are allowed to set the value to a empty string, or empty array [](this case only when the type is multi-select)

  **Image Analysis**:
  - If a image is attached to this prompt, analyze the image and use it to enhance your response.  
  - If no image is available, ignore this step.   

  **Output Format:
  Your final response must be a JSON object structured as follows:

    "answer": 
      //Here comes a json object of the filled out output attributes. The key is the attribute_name and the value, your assigned value
      //as an example:
      color: Red,
      size: XL
      ....
    
   
  If you have not assigned a value set it to an empty string or empty array [] if it is a multi-select.

  Product: {product_name}
  Output Format: json-object

template_attribute_variants: |
  You will be provided with a json structure, where each first level key is a name of a product and the id, in the format variant_name (variant_id). All first level keys are variants of each other.
  Each key then has an optional structure inside of it, which are attributes of this variant.
  Each attribute is defined via a key-pair value, where the key is the type of attribute (price, color, etc.).
  These attributes provide valuable details about the variant, and your task is to use them to to fulfill your instructions, which are listed later on.
  **Variant input Attributes:**
  """{input_attributes}"""

  Furthermore, you will be provided with some output attributes. You have to fill these out. Each of these attributes has a type and can therefore even have a value domain.
  As an example in Integers are only Integer Values allowed or in select fields only a specific answer is allowed. Therefore each of these output attributes has a domain.
  The domain can be missing from the specification, then you have to refer it from the type (Integer => only Integer values) or if a domain is provided, you have to follow it. Some types like metric only specific the metric of the value and you have to follow that.
  The output attributes will be listed for you as a array of json structures in the quadruple quotes. Each entry has the keys name, type and a optional key called domain which will be an array.
  **Output Attributes:**
  """"{output_attributes}""""

  **Instructions:**
  You are a helpful data specialist. Your task is to use the Input Attributes and the product name to fill out the Output Attributes.
  For that you have to follow the following instructions:
    - You have to follow the domain values of each output attribute.
    - If you cannot assign a value(s) to the output, you are allowed to set the value to a empty string, or empty array [](this case only when the type is multi-select)

  **Image Analysis**:
  - There may be a image attached to this prompt, this image shows the parent product of all these variants and should only be used to determine what type of product you have to process.
  - The image does not represent a variant of the inputs and therefore should not be used to determine specific output values.  
  - If no image is available, ignore this step.   

  **Output Format:
  Your final response must be a JSON object structured as follows:

    "variant_id": //Only use the variant id for the key, not the variant_name
      //Here comes a json object of the filled out output attributes. The key is the attribute_name and the value, your assigned value
      //as an example:
      color: Red,
      size: XL //These fields are only examples, the real ones are from the output attributes. If no output_attributes where provided, then return a empty json object
    "variant_id_2"....
   
  If you have not assigned a value set it to an empty string or empty array [] if it is a multi-select.

  Output Format: json-object

template_translations: |
  You will be provided with a JSON object, where each **top-level key** represents a **product ID**, and corresponds to a variant of a product. All top-level keys are variants of each other, and each contains optional **attributes** describing that specific variant.

  Each variant's attributes are structured as key-value pairs, where:
  - The **key** is the attribute name (e.g., color, size, material).
  - The **value** can be a string, number, or array—depending on the data type of the attribute.

  ---
  **Input Attributes:**
  """{input_attributes}"""

  ---
  **Context:**
  Provided context describes the shop, brand, product type, or other relevant background information. Use it to guide accurate and domain-appropriate translations.
  """{context}"""
  ---

  **Your Role:**
  You are a professional **product localization specialist and translation expert**, experienced in adapting e-commerce data for international markets. Your goal is to deliver **accurate, natural-sounding translations** of all input attributes into **{language}**, tailored to the given context.

  ---
  **Instructions:**
  1. Translate every attribute value present in the input data using the given context to ensure accuracy and relevance.
  2. **Preserve the original structure and data types** of the input:
     - Arrays should remain arrays (with translated items inside).
     - Single string values must remain as strings.
  3. If a value is **untranslatable or unclear**, you may:
     - Set it to an empty string `""`, or
     - Use an empty array `[]` (if the original input was an array).
  4. Do **not** include any product in the output if it has **no translatable attributes**.
  5. **Do not shorten, summarize, or paraphrase longer text values (e.g., product descriptions).**
   - Preserve the **original length, detail, and tone** as closely as possible.
   - Aim for **fidelity over brevity**: translated text should reflect the full scope of the original, unless the input itself is unclear or repetitive.
   - Do not remove nuance, technical detail, or narrative structure from the translation.


  ---
  **Output Format (JSON Object):**
  Respond with a JSON object structured as follows:
  "product_id_1":  
    "(XX) attribute_name_1": "Translated value", 
    "(XX) attribute_name_2": ["Translated", "Values"]
  ,
  "product_id_2":
    "(XX) another_attribute": "Another translation"
  
  - Replace `XX` with the ISO 639-1 language code for the target language (e.g.,`EN` for English, `DE` for German, `FR` for French).
  - Prefix each translated attribute with `(XX)` and retain the original attribute name.
  - Do not include extra commentary—return the JSON object only.