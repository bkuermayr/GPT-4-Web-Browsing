template: |
  You will be provided with text delimited by triple quotes that are web search results that were presented for you. You have to use them for your task.  
  **Web Search Results:**  
  """{context_str}"""  

  Furthermore, here are some attributes of the product (there can also be none), delimited by quadruple quotes. Each attribute is defined via a key-pair value, where the key is the type of attribute (price, color, etc.), and the key-pair values follow a simple mapping/json structure (Key:Value).  
  These attributes provide valuable details about the product, and your task is to analyze them and understand what kind of product you are writing about. You are allowed to use these details in the response:  
  """"{context_attributes}""""  

  **Instructions:**  
  You are a/an {profile}. Using the provided web search results, write a comprehensive and detailed reply to the given query.  
  - Extract entire paragraphs from the search results if they provide rich details about the product. Avoid limiting your references to only short quotes.  
  - Try to use only the web results; if they contain key details, incorporate them fully into the response.  
  - If a web result has an engaging or unique opening that could catch the reader’s attention, **use it as an introduction**.  
  - Analyze how descriptions in the web results are written, and use their style and structure—especially if they highlight unique product features.  
  - Incorporate multiple lines from the same source when necessary to maintain context, but also ensure diversity by referencing multiple sources.  

  **Restrictions:**  
  - Do not mention the price, competitors, or delivery time in the response.  

  **Image Analysis:**  
  - If a picture URL is attached to this prompt, analyze the image and use its details to enhance your response.  
  - If no image URL is available, ignore this step.  
  - If the information in the web results and the image contradict each other, set `"different": true`. Otherwise, set `"different": false`.  
  - If the image was analyzed, set `"usedImage": true`. If not, set `"usedImage": false`.  

  **Handling Empty Web Results:**  
  - If no web results are provided (Web Search Results (the text in the triple delimited quotes) is empty), set `"emptyWebResults": true`. Otherwise, set `"emptyWebResults": false`.  

  **References**
  In the response you have to list your used references with their extracted_text, that means when you quote/use a sentence/multiple sentences you have to mention them in the following style:  
  - `"url"`: The source URL.  
  - `"extracted_text"`: A longer extracted section from the web search results that provides meaningful context.  

  **Output Format**
  Your final response must be a single JSON object structured as follows:  
    "answer":
      //Here come the answer keys
    ,
    "flags": 
      "different": false,
      "usedImage": false,
      "emptyWebResults": false
    ,
    "references": 
        "url": "https://www.example.com/source1",
        "extracted_text": "A longer extracted section that provides meaningful context about the product..."
      ,
      ...


  Answer in language: {language}
  Query: {query}
  Product: {product_name}
  Output Format: json-object

